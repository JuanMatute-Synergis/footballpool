<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>NFL Weekly Picks</title>
  <base href="/">
  <!-- viewport-fit=cover is required for env(safe-area-inset-*) to report real values -->
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">

  <!-- PWA -->
  <link rel="manifest" href="manifest.webmanifest">
  <meta name="theme-color" content="#ffffff">
  <meta name="description" content="Make your weekly NFL picks, track the leaderboard, and follow live scores.">

  <!-- iOS home screen: Safari ignores the manifest for these -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="NFL Picks">
  <link rel="apple-touch-icon" href="assets/icons/apple-touch-icon-180.png">

  <link rel="icon" type="image/png" sizes="32x32" href="assets/icons/favicon-32.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
</head>
<body class="bg-gray-50 dark:bg-gray-900">
  <app-root></app-root>
</body>
</html>
