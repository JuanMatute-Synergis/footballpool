name: Deploy to Self-Hosted Runner

on:
  push:
    branches: [ main ]
  workflow_dispatch:

# Only one deploy at a time; a queued deploy waits rather than racing the running one.
concurrency:
  group: deploy-self-hosted
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: self-hosted
    timeout-minutes: 30

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Resolve docker compose command
      timeout-minutes: 5
      run: |
        # Docker Desktop may still be starting after a reboot; give it a bounded wait
        # rather than letting the build step block on an unreachable daemon.
        for i in $(seq 1 30); do
          if docker info > /dev/null 2>&1; then
            echo "✅ Docker daemon is ready"
            break
          fi
          echo "⏳ Waiting for Docker daemon... ($i/30)"
          sleep 5
          if [ "$i" -eq 30 ]; then
            echo "❌ Docker daemon is not responding on this runner"
            exit 1
          fi
        done
        
        # Prefer the standalone docker-compose binary. `docker compose` is a CLI plugin
        # discovered through DOCKER_CONFIG, and the build step swaps DOCKER_CONFIG for a
        # throwaway dir to bypass credential helpers — which makes the subcommand vanish.
        if command -v docker-compose > /dev/null 2>&1; then
          echo "COMPOSE=docker-compose" >> "$GITHUB_ENV"
        elif docker compose version > /dev/null 2>&1; then
          echo "COMPOSE=docker compose" >> "$GITHUB_ENV"
        else
          echo "❌ Neither 'docker compose' nor 'docker-compose' is available on this runner"
          exit 1
        fi

    - name: Setup data directory with absolute path
      run: |
        echo "Setting up data directory with absolute path..."
        
        # Define the absolute data directory
        DATA_DIR="/Users/juanmatute/data/nfl-picks"
        
        # Create the directory if it doesn't exist
        mkdir -p "$DATA_DIR"
        
        # If we have existing data in relative path, migrate it
        if [ -f "/Users/juanmatute/data/nfl-picks/database.sqlite" ] && [ ! -f "$DATA_DIR/database.sqlite" ]; then
          echo "Migrating existing data from ./data to $DATA_DIR"
          cp -r ./data/* "$DATA_DIR/" 2>/dev/null || true
          echo "✅ Data migration completed"
        fi
        
        # Verify the data directory
        ls -la "$DATA_DIR/"
        echo "✅ Data directory setup complete: $DATA_DIR"

    - name: Create data backup before deployment
      run: |
        echo "Creating backup before deployment..."
        DATA_DIR="/Users/juanmatute/data/nfl-picks"
        
        if [ -f "$DATA_DIR/database.sqlite" ]; then
          # Create timestamped backup
          timestamp=$(date +%Y%m%d_%H%M%S)
          cp "$DATA_DIR/database.sqlite" "$DATA_DIR/database.sqlite.backup.$timestamp"
          echo "✅ Database backup created: database.sqlite.backup.$timestamp"
          
          # Also create a pre-deployment backup for immediate recovery if needed
          cp "$DATA_DIR/database.sqlite" "$DATA_DIR/database.sqlite.pre-deploy"
          echo "✅ Pre-deployment backup created"
          
          # Verify backup
          ls -la "$DATA_DIR"/database.sqlite*
          
          # Also backup to Google Drive if configured (copy to workspace first)
          if command -v rclone &> /dev/null && rclone lsd gdrive: > /dev/null 2>&1; then
            echo "📤 Creating deployment backup to Google Drive..."
            cp "$DATA_DIR/database.sqlite" ./database.sqlite.temp
            ./scripts/backup-to-gdrive.sh || echo "⚠️ Google Drive backup failed (continuing deployment)"
            rm -f ./database.sqlite.temp
          else
            echo "ℹ️ Google Drive backup not configured"
          fi
        else
          echo "ℹ️ No existing database found in $DATA_DIR"
        fi

    - name: Smart deployment with data protection
      run: |
        echo "=== Smart Deployment Strategy ==="
        DATA_DIR="/Users/juanmatute/data/nfl-picks"
        
        # Create multiple backup layers before ANY operations
        if [ -f "$DATA_DIR/database.sqlite" ]; then
          timestamp=$(date +%Y%m%d_%H%M%S)
          
          # Create backup directory if it doesn't exist
          mkdir -p ./backups
          
          # 1. Timestamped backup
          cp "$DATA_DIR/database.sqlite" "$DATA_DIR/database.sqlite.backup.$timestamp"
          
          # 2. Pre-deployment backup (for emergency restoration) - CRITICAL!
          cp "$DATA_DIR/database.sqlite" "$DATA_DIR/database.sqlite.pre-deploy"
          
          # 3. Working copy backup (to detect corruption)
          cp "$DATA_DIR/database.sqlite" "./database.working.backup"
          
          # 4. Extra safety backup in backups directory
          cp "$DATA_DIR/database.sqlite" "./backups/emergency-backup-$timestamp.sqlite"
          
          # Verify all backups were created
          echo "=== Backup Verification ==="
          ls -la "$DATA_DIR"/database.sqlite*
          ls -la ./database.*.backup
          ls -la ./backups/emergency-backup-$timestamp.sqlite
          
          user_count=$(curl -s http://localhost:3001/api/auth/health | jq -r '.user_count // "0"' 2>/dev/null || echo "0")
          echo "✅ All backups created. Current user count: $user_count"
          
          # 5. Google Drive backup
          if command -v rclone &> /dev/null && rclone lsd gdrive: > /dev/null 2>&1; then
            echo "📤 Google Drive backup..."
            cp "$DATA_DIR/database.sqlite" ./database.sqlite.temp
            ./scripts/backup-to-gdrive.sh || echo "⚠️ Google Drive backup failed"
            rm -f ./database.sqlite.temp
          fi
        else
          echo "⚠️ No database found to backup in $DATA_DIR"
        fi

    - name: Build new image safely
      timeout-minutes: 15
      run: |
        echo "Building new container image (data directory excluded via .dockerignore)..."
        
        # Unlock keychain to resolve Docker credential issues.
        # stdin is closed so a missing password prompts nothing and fails fast instead of
        # hanging the job forever waiting on a tty that a runner service does not have.
        security -v unlock-keychain ~/Library/Keychains/login.keychain-db < /dev/null || echo "Keychain unlock failed, continuing..."
        
        # Clear Docker credentials and cache
        docker logout || true
        docker system prune -f || true
        
        # Set Docker to not use credential helpers for this build, while still pointing
        # the CLI at the real plugin directories so `docker compose` keeps resolving.
        PLUGIN_DIRS="${DOCKER_CONFIG:-$HOME/.docker}/cli-plugins"
        export DOCKER_CONFIG=$(mktemp -d)
        cat > "$DOCKER_CONFIG/config.json" <<EOF
        {"cliPluginsExtraDirs": ["$PLUGIN_DIRS", "/usr/local/lib/docker/cli-plugins", "/opt/homebrew/lib/docker/cli-plugins"]}
        EOF
        
        $COMPOSE build --no-cache

    - name: Deploy with zero-downtime data protection
      run: |
        echo "Performing zero-downtime deployment..."
        
        # Stop current container gracefully
        $COMPOSE stop nfl-picks || true
        sleep 3
        
        # Verify data is still intact after stopping
        DATA_DIR="/Users/juanmatute/data/nfl-picks"
        if [ -f "$DATA_DIR/database.sqlite" ] && [ -f "./database.working.backup" ]; then
          if ! cmp -s "$DATA_DIR/database.sqlite" "./database.working.backup"; then
            echo "⚠️ Database changed during shutdown, restoring from working backup"
            cp "./database.working.backup" "$DATA_DIR/database.sqlite"
          fi
        fi
        
        # Ensure data directory exists and is properly accessible
        mkdir -p "$DATA_DIR"
        ls -la "$DATA_DIR"
        
        # Start new container
        echo "Starting new container with volume mount verification..."
        $COMPOSE up -d nfl-picks
        
        # Wait longer for proper volume mount and database initialization
        echo "Waiting for container to fully initialize with volume mount..."
        sleep 45
        
        # Check container logs for startup issues
        echo "=== Container startup logs ==="
        $COMPOSE logs --tail=10 nfl-picks
        
        # Critical data integrity check with more attempts and patience  
        max_attempts=5
        attempt=1
        
        while [ $attempt -le $max_attempts ]; do
          user_count=$(curl -s http://localhost:3001/api/auth/health | jq -r '.user_count // "0"' 2>/dev/null || echo "0")
          
          if [ "$user_count" != "0" ] && [ "$user_count" != "null" ]; then
            echo "✅ Deployment successful! User count: $user_count"
            # Clean up working backup on success
            rm -f "./database.working.backup"
            break
          else
            echo "❌ Attempt $attempt/$max_attempts: User count is $user_count"
            echo "Container status:"
            $COMPOSE ps
            echo "Recent container logs:"
            $COMPOSE logs --tail=5 nfl-picks
            
            if [ $attempt -eq $max_attempts ]; then
              echo "🚨 EMERGENCY: Deploying data recovery procedures"
              
              # Emergency stop and restore
              $COMPOSE down
              DATA_DIR="/Users/juanmatute/data/nfl-picks"
              
              # Try multiple backup sources in order of preference
              restored=false
              
              # 1. Try pre-deployment backup first (new fixed filename)
              if [ -f "$DATA_DIR/database.sqlite.pre-deploy" ]; then
                echo "Restoring from pre-deployment backup..."
                cp "$DATA_DIR/database.sqlite.pre-deploy" "$DATA_DIR/database.sqlite"
                $COMPOSE up -d nfl-picks
                sleep 15
                
                # Verify emergency restoration
                user_count=$(curl -s http://localhost:3001/api/auth/health | jq -r '.user_count // "0"' 2>/dev/null || echo "0")
                
                if [ "$user_count" != "0" ]; then
                  echo "✅ Emergency restoration successful! User count: $user_count"
                  restored=true
                fi
              fi
              
              # 2. Try emergency backup from backups directory
              if [ "$restored" = false ]; then
                emergency_backup=$(ls -t ./backups/emergency-backup-*.sqlite 2>/dev/null | head -n1)
                if [ -f "$emergency_backup" ]; then
                  echo "Restoring from emergency backup: $emergency_backup"
                  cp "$emergency_backup" "$DATA_DIR/database.sqlite"
                  $COMPOSE up -d nfl-picks
                  sleep 15
                  
                  user_count=$(curl -s http://localhost:3001/api/auth/health | jq -r '.user_count // "0"' 2>/dev/null || echo "0")
                  
                  if [ "$user_count" != "0" ]; then
                    echo "✅ Emergency backup restoration successful! User count: $user_count"
                    restored=true
                  fi
                fi
              fi
              
              # 3. Try any recent timestamped backup
              if [ "$restored" = false ]; then
                recent_backup=$(ls -t /Users/juanmatute/data/nfl-picks/database.sqlite.backup.* 2>/dev/null | head -n1)
                if [ -f "$recent_backup" ]; then
                  echo "Restoring from recent backup: $recent_backup"
                  cp "$recent_backup" "/Users/juanmatute/data/nfl-picks/database.sqlite"
                  $COMPOSE up -d nfl-picks
                  sleep 15
                  
                  user_count=$(curl -s http://localhost:3001/api/auth/health | jq -r '.user_count // "0"' 2>/dev/null || echo "0")
                  
                  if [ "$user_count" != "0" ]; then
                    echo "✅ Recent backup restoration successful! User count: $user_count"
                    restored=true
                  fi
                fi
              fi
              
              if [ "$restored" = false ]; then
                echo "❌ CRITICAL: All restoration attempts failed. Manual intervention required."
                echo "Available backups:"
                ls -la /Users/juanmatute/data/nfl-picks/database.sqlite* 2>/dev/null || echo "No database backups found"
                ls -la ./backups/ 2>/dev/null || echo "No emergency backups found"
                exit 1
              fi
              
              # Restored — leave the retry loop instead of spinning on the last attempt forever
              break
            else
              echo "Retrying in 20 seconds..."
              sleep 20
              attempt=$((attempt + 1))
            fi
          fi
        done
        
        # Clean up pre-deployment backup on success
        rm -f "/Users/juanmatute/data/nfl-picks/database.sqlite.pre-deploy"

    - name: Verify data integrity after deployment
      run: |
        echo "=== Data integrity verification ==="
        ls -la ./data/ || echo "No data directory found"
        if [ -f "/Users/juanmatute/data/nfl-picks/database.sqlite" ]; then
          echo "Database size: $(du -h /Users/juanmatute/data/nfl-picks/database.sqlite)"
          
          # Verify database is not empty and has users
          user_count=$(curl -s http://localhost:3001/api/auth/health | jq -r '.user_count // "0"' 2>/dev/null || echo "0")
          echo "User count after deployment: $user_count"
          
          if [ "$user_count" = "0" ]; then
            echo "❌ CRITICAL: Database appears to be empty after deployment!"
            echo "This indicates data loss occurred during deployment."
            exit 1
          else
            echo "✅ Database integrity verified - $user_count users found"
          fi
        else
          echo "❌ Database file missing after deployment!"
          exit 1
        fi

    - name: Verify deployment and data integrity
      run: |
        echo "Waiting for services to be ready..."
        sleep 30
        
        echo "=== Final verification ==="
        # Check if containers are running
        $COMPOSE ps
        
        # Check database integrity
        if [ -f "/Users/juanmatute/data/nfl-picks/database.sqlite" ]; then
          echo "✅ Database file exists: $(du -h /Users/juanmatute/data/nfl-picks/database.sqlite)"
          
          # Test API connectivity and user count
          echo "Testing API health..."
          max_attempts=5
          attempt=1
          
          while [ $attempt -le $max_attempts ]; do
            user_count=$(curl -s http://localhost:3001/api/auth/health | jq -r '.user_count // "0"' 2>/dev/null || echo "0")
            
            if [ "$user_count" != "0" ] && [ "$user_count" != "null" ]; then
              echo "✅ API responding with $user_count users"
              break
            else
              echo "⏳ Attempt $attempt/$max_attempts - API not ready or no users found"
              if [ $attempt -eq $max_attempts ]; then
                echo "❌ API failed to respond properly after $max_attempts attempts"
                
                # Emergency restoration from pre-deployment backup
                if [ -f "/Users/juanmatute/data/nfl-picks/database.sqlite.pre-deploy" ]; then
                  echo "🚨 Attempting emergency restoration from pre-deployment backup..."
                  $COMPOSE down
                  cp /Users/juanmatute/data/nfl-picks/database.sqlite.pre-deploy /Users/juanmatute/data/nfl-picks/database.sqlite
                  $COMPOSE up -d
                  sleep 15
                  
                  # Verify restoration
                  user_count=$(curl -s http://localhost:3001/api/auth/health | jq -r '.user_count // "0"' 2>/dev/null || echo "0")
                  echo "User count after emergency restoration: $user_count"
                  
                  if [ "$user_count" != "0" ]; then
                    echo "✅ Emergency restoration successful"
                    break
                  else
                    echo "❌ Emergency restoration failed"
                    exit 1
                  fi
                else
                  echo "❌ No pre-deployment backup available for restoration"
                  exit 1
                fi
              else
                sleep 10
                attempt=$((attempt + 1))
              fi
            fi
          done
        else
          echo "❌ Database file missing after deployment!"
          exit 1
        fi
        
        # Clean up pre-deployment backup on success
        rm -f /Users/juanmatute/data/nfl-picks/database.sqlite.pre-deploy

    - name: Deployment complete
      run: |
        echo "🎉 Deployment completed successfully!"
        echo "Application available at: http://localhost:4200"
        echo "Backend API at: http://localhost:3000"

    - name: Health check with retries
      run: |
        echo "Performing health check..."
        
        # Show container status
        $COMPOSE ps
        
        # Try health check with retries
        for i in {1..5}; do
          echo "Health check attempt $i/5..."
          
          response=$(curl -s -o /dev/null -w "%{http_code}" http://localhost:3001/api/games/live || echo "000")
          
          if [ "$response" = "200" ]; then
            echo "✅ Health check passed - Application is running"
            echo "🚀 Deployment successful!"
            exit 0
          else
            echo "⏳ Health check failed (attempt $i/5) - HTTP status: $response"
            if [ $i -eq 5 ]; then
              echo "❌ All health check attempts failed"
              echo "Container logs:"
              $COMPOSE logs --tail=20
              exit 1
            fi
            sleep 10
          fi
        done

    - name: Show container logs on failure
      if: failure()
      run: |
        echo "=== Deployment Failed - Container Status ==="
        $COMPOSE ps
        echo "=== Container Logs ==="
        $COMPOSE logs --tail=50
